name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The tests run straight from source: only pytest and the runtime
      # dependencies are installed, the package itself is not (pytest's
      # pythonpath setting makes it importable), so a broken install can
      # never mask a broken source tree.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group test requests PyYAML
      - name: Run tests
        run: pytest
