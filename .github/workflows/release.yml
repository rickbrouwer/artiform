name: Release

# Runs on the tag that `tbump` pushes (see docs/contrib/releases.md): tests
# the tagged tree once more, builds the container image and pushes it to
# GitHub Container Registry as ghcr.io/<owner>/artiform, then creates a GitHub
# Release with the version's changelog section as release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag matches version, tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # A tag that does not match pyproject.toml would publish an image whose
      # `artiform --version` lies about what it is.
      - name: Check that the tag matches pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $version"
            exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group test requests PyYAML
      - name: Run tests
        run: pytest

  image:
    name: Build and push image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 -> 1.2.3, 1.2 and latest; the bare major tag only from 1.0.0
      # on, because 0.x releases make no compatibility promise.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Create GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The release notes are the changelog section of this version: every
      # line between the `## <version>` heading (matched on its first two
      # words, so a date after the version is fine) and the next `## `
      # heading. A missing or empty section fails the job instead of
      # publishing an empty release. A re-run of the workflow for a tag that
      # already has a release (e.g. to rebuild the image) leaves it untouched.
      - name: Create release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$1=="##" && $2==v {f=1;next} /^## /{f=0} f' docs/changelog.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::no or empty '## $version' section in docs/changelog.md"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, leaving it as is"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
