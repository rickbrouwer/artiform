name: Release

# Runs on the tag that `tbump` pushes (see docs/contrib/releases.md): tests
# the tagged tree once more, then builds the container image and pushes it to
# GitHub Container Registry as ghcr.io/<owner>/artiform.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag matches version, tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # A tag that does not match pyproject.toml would publish an image whose
      # `artiform --version` lies about what it is.
      - name: Check that the tag matches pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $version"
            exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group test requests PyYAML
      - name: Run tests
        run: pytest

  image:
    name: Build and push image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 -> 1.2.3, 1.2 and latest; the bare major tag only from 1.0.0
      # on, because 0.x releases make no compatibility promise.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
